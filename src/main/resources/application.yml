spring:
  application:
    name: biblio-auth-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/biblio_esprit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.biblio: DEBUG
    org.springframework.security: DEBUG

# Configuration JWT
jwt:
  secret: YSF_SECRET_KEY_FOR_BIBLIO_ESPRIT_AUTH_SERVICE_2024
  expiration: 432000000 # 5 jours en millisecondes